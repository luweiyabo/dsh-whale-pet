name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }} 发布检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查语法
        run: npm run check

      - name: 检查格式
        run: npm run format:check

      - name: 运行测试
        run: npm test

      - name: 检查 npm 发布内容
        run: npm pack --dry-run
