name: 持续集成

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }} 发布检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # DSH 0.2.2 要求 Node >=24.9，故只跑 24.x；插件 engines.node 仍兼容 22.19（npm 提示用）
        node: [24.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查语法
        run: npm run check

      - name: 检查格式
        run: npm run format:check

      - name: 运行测试
        run: npm test

      - name: 检查 npm 发布内容
        run: node scripts/check-pack.mjs
