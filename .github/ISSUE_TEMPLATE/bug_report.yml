name: Bug 报告
description: 报告可以稳定复现的功能或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要填写公开 Issue，请按照 SECURITY.md 私密报告。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写操作系统、Node.js、DSH 和浏览器版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行……
        2. 打开……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与日志
      description: 请移除 API Key、Token、用户名和本地私有路径。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附截图、录屏或最小复现仓库。
